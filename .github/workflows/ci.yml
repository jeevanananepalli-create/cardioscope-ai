name: Python (ML and API)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r apps/api/requirements.txt
      # The dataset and the trained models are not in the repository (see README), so
      # tests marked `requires_dataset` and the API tests that need models skip here.
      # The leakage, schema, selection, calibration-rule and configuration tests that
      # need neither still run. Run the full suite locally with the dataset in place.
      - name: Run tests
        run: python -m pytest -q -rs
